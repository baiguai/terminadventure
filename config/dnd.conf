# D&D 5E reference data for the Players pane.
#
# The app loads ./config/dnd.conf at startup and builds the Race / Class /
# Background / Alignment pickers, the skill and saving-throw lists, and the
# generated equipment / features from it. Edit freely - the app reads the file
# again the next time it starts.
#
# Format by section (blank lines and lines starting with '#' are ignored):
#
#   [alignments]
#     one alignment per line
#
#   [skills]
#     Skill Name | ABILITY  (ABILITY is STR/DEX/CON/INT/WIS/CHA)
#
#   [backgrounds]
#     Background Name | item^item^item ...
#
#   [races]
#     Race Name | speed | STR+1 DEX+1 ... | feature^feature ...
#       (the ability bonuses are 'STAT+N' tokens separated by spaces)
#
#   [classes]
#     Class Name | hitdie | STR,CON | skill,skill,... | equip,equip,... | 1:Name|desc^2:Name|desc
#       (features are LEVEL:Name|description items joined by '^';
#        description text may contain commas, but not '|' or '^')

