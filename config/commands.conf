# terminadventure keymap & command configuration
#
# One entry per line:  mode  key  repeat  command  args  op  description
#
#   mode     TREE | NORMAL | INSERT | VISUAL  binds `key` in that mode.
#            GLOBAL                           registers a command only (no key).
#
#   key      a single character (j, :, 0, $), a special token
#            (Esc, Return, Tab, Backspace, Space,
#             ArrowUp, ArrowDown, ArrowLeft, ArrowRight,
#             PageUp, PageDown, Home, End), or a quoted multi-key
#            sequence like "g g".  '-' means no key binding.
#
#   repeat   yes | no  whether the key accepts a count prefix (3 j).
#
#   command  optional ':name' usable from the command line.
#            '-' means the entry has no command-line access.
#            When args is 'prompt', this name is also what gets
#            prepopulated in the command field when the key is pressed.
#
#   args     -         no arguments are passed.
#            prompt    the key opens the command line with ':command '
#                      already typed so you can enter the arguments.
#                      Requires `command` to be set.
#            <text>    passed verbatim to the function.
#
#   op       the operation name the loader dispatches on.  If `command`
#            is '-', the operation is reachable ONLY through the key; if
#            `command` is set, it can also be run as ':command [args]'.
#
#   description  the user-facing text shown in the '?' help dialog.
#            Quote it when it contains spaces:  "Move cursor up".
#
# Lines starting with '#' and blank lines are ignored.

# ---- TREE mode ------------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  TREE            ArrowUp      yes   -               -       move_up                       "Move selection up"
  TREE            ArrowDown    yes   -               -       move_down                     "Move selection down"
  TREE            k            yes   -               -       move_up                       "Move selection up"
  TREE            j            yes   -               -       move_down                     "Move selection down"
  TREE            G            no    -               -       move_file_end                 "Jump to last node"
  TREE            "g g"        no    -               -       move_file_start               "Jump to first node"
  TREE            Return       yes   -               -       tree_open                     "Open selected node"
  TREE            h            yes   -               -       tree_collapse                 "Collapse selected node"
  TREE            l            yes   -               -       tree_expand                   "Expand selected node"
  TREE            E            no    -               -       expand_all                    "Expand all nodes"
  TREE            C            no    -               -       collapse_all                  "Collapse all nodes"
  TREE            A            no    create_child    prompt  new_child                     "Add a child to the selected node"
  TREE            a            no    create_node     prompt  new_node                      "Add a new node"
  TREE            R            no    rename          prompt  rename_node                   "Rename selected node"
  TREE            D            no    -               -       delete_node                   "Delete selected node"
  TREE            i            no    -               -       enter_normal                  "Switch to NORMAL mode"
  TREE            t            no    export_note_txt prompt  export_note_txt               "Export current note as .txt"
  TREE            T            no    export_tree_txt prompt  export_tree_txt               "Export current tree branch as .txt"
  TREE            I            no    -               -       enter_insert                  "Switch to INSERT mode"
  TREE            :            no    -               -       enter_command                 "Open the command line"
  TREE            J            yes   -               -       move_node_down                "Move selected node down"
  TREE            K            yes   -               -       move_node_up                  "Move selected node up"
  TREE            H            yes   -               -       move_parent_up                "Move selected node up a level"
  TREE            L            yes   -               -       move_parent_down              "Move selected node down a level"
  TREE            S            no    saveas          prompt  saveas                        "Save the document as..."
  TREE            w            no    -               -       save                          "Save the document"
  TREE            ?            no    -               -       show_help                     "Show this help"
  TREE            /            no    -               -       search_start                  "Search the tree"
  TREE            n            no    -               -       search_next                   "Jump to the next match"
  TREE            N            no    -               -       search_prev                   "Jump to the previous match"
  TREE            ]            yes   -               -       treeview_width_increase       "Widen the tree pane"
  TREE            [            yes   -               -       treeview_width_decrease       "Narrow the tree pane"
  TREE            #            no    links           -       links                         "Open the links dialog"
  TREE            X            no    brklinks        -       show_broke_links              "Lists any broken links"
  TREE            m            no    bookmark        -       bookmark                      "Bookmark this node"
  TREE            `            no    bookmarks       -       bookmarks                     "Show bookmarks"
  TREE            <            no    -               -       history                       "Show history"
  TREE            o            no    o               prompt  open                          "Open a file..."
  TREE            O            no    -               -       recents                       "Show recent files"
  TREE            u            no    -               -       undo                          "Undo last change"
  TREE            Esc          no    -               -       deselect_node                 "Deselect the node"
  
# ---- NORMAL mode ----------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  NORMAL          ArrowUp      no    -               -       cursor_up                     "Move cursor up"
  NORMAL          ArrowDown    no    -               -       cursor_down                   "Move cursor down"
  NORMAL          ArrowLeft    no    -               -       cursor_left                   "Move cursor left"
  NORMAL          ArrowRight   no    -               -       cursor_right                  "Move cursor right"
  NORMAL          PageUp       no    -               -       cursor_page_up                "Scroll up 10 lines"
  NORMAL          PageDown     no    -               -       cursor_page_down              "Scroll down 10 lines"
  NORMAL          Home         no    -               -       cursor_line_start             "Jump to start of line"
  NORMAL          End          no    -               -       cursor_line_end               "Jump to end of line"
  NORMAL          h            yes   -               -       cursor_left                   "Move cursor left"
  NORMAL          j            yes   -               -       cursor_down                   "Move cursor down"
  NORMAL          k            yes   -               -       cursor_up                     "Move cursor up"
  NORMAL          J            yes   -               -       move_line_down                "Move the current line down"
  NORMAL          K            yes   -               -       move_line_up                  "Move the current line up"
  NORMAL          l            yes   -               -       cursor_right                  "Move cursor right"
  NORMAL          i            no    -               -       enter_insert                  "Enter INSERT mode before cursor"
  NORMAL          a            no    -               -       enter_insert                  "Enter INSERT mode after cursor"
  NORMAL          v            no    -               -       enter_visual                  "Start character selection"
  NORMAL          V            no    -               -       enter_visual_line             "Start line selection"
  NORMAL          CtrlV        no    -               -       enter_visual_block            "Start column (block) selection"
  NORMAL          CtrlDash     no    -               -       insert_rule                   "Insert an 80-dash rule (Ctrl+Shift+- if the terminal zooms)"
  NORMAL          CtrlRBracket no    -               -       insert_link                   "Search nodes and insert a _Title_ link at the cursor (Ctrl+])"
  NORMAL          x            no    -               -       delete_char                   "Delete the character under the cursor"
  NORMAL          u            no    -               -       undo                          "Undo last change"
  NORMAL          y            no    -               -       yank                          "Copy the current line"
  NORMAL          p            no    -               -       paste                         "Paste the clipboard"
  NORMAL          w            no    -               -       cursor_word_forward           "Jump to start of next word"
  NORMAL          e            yes   -               -       cursor_word_end               "Jump to end of word"
  NORMAL          b            yes   -               -       cursor_word_back              "Jump to start of previous word"
  NORMAL          0            no    -               -       cursor_line_start             "Jump to start of line"
  NORMAL          $            no    -               -       cursor_line_end               "Jump to end of line"
  NORMAL          G            no    -               -       cursor_file_end               "Jump to end of document"
  NORMAL          "d d"        yes   -               -       delete_line                   "Delete the current line"
  NORMAL          D            no    -               -       delete_to_eol                 "Delete from the cursor to end of line"
  NORMAL          "g g"        no    -               -       cursor_file_start             "Jump to start of document"
  NORMAL          "d b"        yes   -               -       delete_word_back              "Delete to end of previous word"
  NORMAL          "d w"        yes   -               -       delete_word_forward           "Delete to start of next word"
  NORMAL          "d i w"      no    -               -       delete_word                   "Delete the inner word"
  NORMAL          Esc          no    -               -       enter_tree                    "Return to the tree"
  NORMAL          m            no    bookmark        -       bookmark                      "Bookmark this node"
  NORMAL          M            no    -               cursor  bookmark                      "Bookmark the node under the cursor"
  NORMAL          `            no    bookmarks       -       bookmarks                     "Show bookmarks"
  NORMAL          :            no    -               -       enter_command                 "Open the command line"
  NORMAL          /            no    -               -       enter_search                  "Find in the document"
  NORMAL          *            no    -               -       search_word                   "Find the word under the cursor"
  NORMAL          n            no    -               -       search_next                   "Jump to the next match"
  NORMAL          N            no    -               -       search_prev                   "Jump to the previous match"
  NORMAL          Backspace    no    -               -       backspace_char                "Delete the character before the cursor"
  NORMAL          #            no    links           -       links                         "Open the links dialog"
  NORMAL          X            no    brklinks        -       show_broke_links              "Lists any broken links"
  NORMAL          <            no    -               -       history                       "Show history"
  NORMAL          O            no    -               -       recents                       "Show recent files"
  NORMAL          S            no    saveas          prompt  saveas                        "Save the document as..."
  NORMAL          R            no    replace         prompt  replace                       "Replace text in this node <old>/<new>"
  
# ---- INSERT mode ----------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  INSERT          Esc          no    -               -       enter_normal                  "Return to NORMAL mode"
  INSERT          CtrlC        no    -               -       yank                          "Copy the current line"
  INSERT          CtrlX        no    -               -       cut                           "Cut the current line"
  INSERT          CtrlV        no    -               -       paste                         "Paste the clipboard"
  INSERT          CtrlDash     no    -               -       insert_rule                   "Insert an 80-dash rule (Ctrl+Shift+- if the terminal zooms)"
  INSERT          CtrlRBracket no    -               -       insert_link                   "Search nodes and insert a _Title_ link at the cursor (Ctrl+])"
  INSERT          Return       no    -               -       insert_newline                "Insert a new line"
  INSERT          Backspace    no    -               -       backspace_char                "Delete the character before the cursor"
  INSERT          Tab          no    -               -       insert_tab                    "Insert a tab"
  INSERT          ArrowUp      no    -               -       cursor_up                     "Move cursor up"
  INSERT          ArrowDown    no    -               -       cursor_down                   "Move cursor down"
  INSERT          ArrowLeft    no    -               -       cursor_left                   "Move cursor left"
  INSERT          ArrowRight   no    -               -       cursor_right                  "Move cursor right"
  
# ---- VISUAL mode ----------------------------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  VISUAL          ArrowUp      no    -               -       cursor_up                     "Extend selection up"
  VISUAL          ArrowDown    no    -               -       cursor_down                   "Extend selection down"
  VISUAL          ArrowLeft    no    -               -       cursor_left                   "Extend selection left"
  VISUAL          ArrowRight   no    -               -       cursor_right                  "Extend selection right"
  VISUAL          h            no    -               -       cursor_left                   "Extend selection left"
  VISUAL          j            no    -               -       cursor_down                   "Extend selection down"
  VISUAL          k            no    -               -       cursor_up                     "Extend selection up"
  VISUAL          l            no    -               -       cursor_right                  "Extend selection right"
  VISUAL          "i w"        no    -               -       select_word                   "Select the word under the cursor"
  VISUAL          w            no    -               -       cursor_word_forward           "Extend selection to next word"
  VISUAL          e            yes   -               -       cursor_word_end               "Extend selection to end of word"
  VISUAL          b            no    -               -       cursor_word_back              "Extend selection to previous word"
  VISUAL          "g g"        no    -               -       cursor_file_start             "Extend selection to document start"
  VISUAL          G            no    -               -       cursor_file_end               "Extend selection to document end"
  VISUAL          0            no    -               -       cursor_line_start             "Jump to start of line"
  VISUAL          $            no    -               -       cursor_line_end               "Jump to end of line"
  VISUAL          y            no    -               -       yank                          "Copy the selection"
  VISUAL          x            no    -               -       cut                           "Cut the selection"
  VISUAL          d            no    -               -       delete_selection              "Delete the selection"
  VISUAL          D            no    -               -       delete_line                   "Delete the selected lines"
  VISUAL          U            no    -               -       upper_selection               "Selection to upper case"
  VISUAL          u            no    -               -       lower_selection               "Selection to lower case"
  VISUAL          R            no    replace         prompt  replace                       "Replace in the selection <old>/<new>"
  VISUAL          Esc          no    -               -       enter_normal                  "Cancel the selection"
  VISUAL          :            no    -               -       enter_command                 "Open the command line"
  VISUAL          ;            no    -               -       format_table                  "Format the table in the selection"
  
# ---- VISUAL BLOCK mode (Ctrl+V: column/rectangle selection) ---------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  VISUAL_BLOCK    ArrowUp      no    -               -       cursor_up                     "Extend block up"
  VISUAL_BLOCK    ArrowDown    no    -               -       cursor_down                   "Extend block down"
  VISUAL_BLOCK    ArrowLeft    no    -               -       cursor_left                   "Narrow block left"
  VISUAL_BLOCK    ArrowRight   no    -               -       cursor_right                  "Widen block right"
  VISUAL_BLOCK    k            yes   -               -       cursor_up                     "Extend block up"
  VISUAL_BLOCK    j            yes   -               -       cursor_down                   "Extend block down"
  VISUAL_BLOCK    h            yes   -               -       cursor_left                   "Narrow block left"
  VISUAL_BLOCK    l            yes   -               -       cursor_right                  "Widen block right"
  VISUAL_BLOCK    w            yes   -               -       cursor_word_forward           "Move right edge to next word"
  VISUAL_BLOCK    b            yes   -               -       cursor_word_back              "Move left edge to previous word"
  VISUAL_BLOCK    e            yes   -               -       cursor_word_end               "Move right edge to word end"
  VISUAL_BLOCK    0            no    -               -       cursor_line_start             "Move left edge to column 0"
  VISUAL_BLOCK    $            no    -               -       block_to_eol                  "Widen block to end of line"
  VISUAL_BLOCK    "g g"        no    -               -       block_file_start              "Extend block to document start"
  VISUAL_BLOCK    G            no    -               -       block_file_end                "Extend block to document end"
  VISUAL_BLOCK    PageUp       yes   -               -       cursor_page_up                "Extend block up 10 lines"
  VISUAL_BLOCK    PageDown     yes   -               -       cursor_page_down              "Extend block down 10 lines"
  VISUAL_BLOCK    d            no    -               -       delete_selection              "Delete the block"
  VISUAL_BLOCK    x            no    -               -       delete_selection              "Delete the block"
  VISUAL_BLOCK    y            no    -               -       yank                          "Copy the block"
  VISUAL_BLOCK    U            no    -               -       upper_selection               "Block to upper case"
  VISUAL_BLOCK    u            no    -               -       lower_selection               "Block to lower case"
  VISUAL_BLOCK    I            no    -               -       block_insert_start            "Insert text at block start"
  VISUAL_BLOCK    A            no    -               -       block_insert_end              "Insert text at block end"
  VISUAL_BLOCK    R            no    replace         prompt  replace                       "Replace in the block <old>/<new>"
  VISUAL_BLOCK    Esc          no    -               -       enter_normal                  "Cancel the block"
  
# ---- GLOBAL commands (no key binding) -------------------------------------
# MODE            KEY          REP   CMD             ARGS    OP                            DESC
  GLOBAL          -            -     ?               -       show_help                     "Show this help"
  GLOBAL          -            -     noh             -       search_clear                  "Clear the search highlight"
  GLOBAL          -            -     qa              -       quit                          "Quit the application"
  GLOBAL          -            -     qa!             -       quit_force                    "Quit even with unsaved changes"
  GLOBAL          -            -     open            -       open                          "Open a file..."
  GLOBAL          -            -     o               -       open                          "Open a file..."
  GLOBAL          -            -     o!              -       open_force                    "Force open a file, discarding unsaved changes"
  GLOBAL          -            -     O               -       recents                       "Show recent files"
  GLOBAL          -            -     O!              -       recents_force                 "Show recent files, forcing open over unsaved changes"
  GLOBAL          -            -     w               -       save                          "Save the document"
  GLOBAL          -            -     n               -       new_document                  "Create a new document"
  GLOBAL          -            -     n!              -       new_document_force            "Create a new document, discarding unsaved changes"
  GLOBAL          -            -     enew            -       new_document                  "Create a new document"
  GLOBAL          -            -     enew!           -       new_document_force            "Create a new document, discarding unsaved changes"
  GLOBAL          -            -     undo            -       undo                          "Undo last change"
  GLOBAL          -            -     U               -       import_html                   "Import from an HTML file..."
  GLOBAL          -            -     X               -       export_html                   "Export to an HTML file..."
  GLOBAL          -            -     x               -       export_terminadventure        "Save as, or export the selected node and its children as a Terminadventure file"
  GLOBAL          -            -     export_note_txt -       export_note_txt               "Export the current note as .txt"
  GLOBAL          -            -     export_tree_txt -       export_tree_txt               "Export the current tree branch as .txt"
  GLOBAL          -            -     rename          -       rename_node                   "Rename selected node"
  GLOBAL          -            -     replace         -       replace                       "Replace in the selection <old>/<new>"
